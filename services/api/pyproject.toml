[project]
name = "api"
version = "0.1.0"
description = "Brasaland API"
readme = "README.md"
authors = [
    { name = "macarenaa558@gmail.com", email = "macarenaa558@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.32",
    "tinydb>=4.9.0",
    "uvicorn>=0.52.3",
]

[project.scripts]
seed = "seed:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "analysis",
    "database",
    "main",
    "models",
    "seed",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["routes*"]